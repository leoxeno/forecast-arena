name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[stats,dev]"
      - name: Run the test suite (core protocol, synthetic tasks, CPU baselines)
        env:
          FORECAST_ARENA_FAST_MODE: "1"
        run: pytest
      - name: Run the quickstart example
        env:
          FORECAST_ARENA_FAST_MODE: "1"
        run: python examples/01_quickstart.py --origins 3 --out /tmp/arena-ci
